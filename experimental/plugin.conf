# Read by ets2_rumble_plugin each time the game starts telemetry (game start,
# or the `sdk reinit` console command). No need to re-copy the plugin after
# editing this file.

# Intercept the game's own vibration (Steam Input) and make the 8BitDo count
# as a gamepad the game vibrates. 1 = on, 0 = off.
steam_input_hook = 1

# If the game decided the controller type before the plugin loaded, briefly
# report "no controllers" so it sets the controller up again. Try 1 if the
# hook is installed but the game never sends vibration.
force_redetect = 1

# How many of the game's controller polls (about one per second) report "no
# controllers" when force_redetect is on. The controller shows as "missing" in
# the game for about this many seconds. Raise it if vibration stops working.
redetect_polls = 2
