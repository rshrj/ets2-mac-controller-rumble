# Rumble strength for ETS2. 0 = off, 1 = default, 2 = max.
# rumble_helper re-reads this file within a second of saving, even mid-drive.

master = 1.0

# The game's own vibration, intercepted from Steam Input (needs
# steam_input_hook = 1 in plugin.conf).
game = 1.0

# Our own telemetry-based effects, layered on top of the game's (per motor,
# the stronger of the two wins). Experimental; set to 1.0 to try them.
# potholes, curbs, road joints (suspension movement)
bumps = 0.0
# gravel, dirt, grass, rumble strips (scales with speed)
surface = 0.0
# hitting things
collisions = 0.0
# constant faint engine hum
engine = 0.0

# Weakest level each motor can be felt at; set by `make calibrate`.
low_min = 0.00
high_min = 0.00

# Record every drive to recordings/ (1 = on, 0 = off). While recording, the
# back paddles stamp markers: PL = "should have rumbled", PR = "false alarm".
record = 0
